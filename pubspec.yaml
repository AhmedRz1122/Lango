name: lango
description: Lango - Offline & Online Translation App with voice support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  vosk_flutter_service: ^0.0.3
  translator: ^1.0.3+1
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  shared_preferences: ^2.3.3
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.0
  uuid: ^4.5.1
  intl: ^0.20.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Lango_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/Lango_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Lango_logo.png
    - assets/models/
